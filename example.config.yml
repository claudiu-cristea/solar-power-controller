# Copy this file to config.yml and edit as appropriate.

inverter:
  # IP of your SDongle on the LAN
  host: 192.168.0.10
  # Modbus TCP port (default 502)
  port: 502
  # Modbus unit/slave ID (usually 1)
  unit_id: 1

#
# Solar thresholds (hysteresis prevents rapid on/off on cloudy days)
#
charging_threshold:
  # Start charging above this (Watts)
  start: 1500
  # Stop charging below this (Watts)
  stop: 800

interval:
  # Seconds between inverter queries
  poll: 30
  # Huawei SDongle needs a pause after TCP connection
  post_connect_delay: 2

#
# Chargers
#
# Add as many chargers as you need. For each charger, specify the charger class
# full qualified name and any configuration options to be passed to the class
# constructor.

# The values below are examples. Use the documentation to find the correct
# values for your charger.
chargers:
  SolarPowerController\Charger\DryRun: ~
  SolarPowerController\Charger\GoE:
    host: 192.168.0.10
  SolarPowerController\Charger\GenericHttp:
    enableUrl: http://192.168.1.102/api/charge/start
    disableUrl: http://192.168.1.102/api/charge/stop

#
# Logging
#
logger:
  default_stream: php://stdout
  error_stream: /var/log/solar-power-controller/error.log
